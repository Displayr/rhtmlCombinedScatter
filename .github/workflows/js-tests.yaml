name: JS tests

on:
  push:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Run only tests matching this name pattern (jest -t). Leave blank for all.'
        type: string
        default: ''
      update_snapshots:
        description: 'Regenerate visual baselines and commit them to this branch'
        type: boolean
        default: false

# One in-flight run per branch; a new push supersedes the previous run rather
# than stacking another full ~427-snapshot visual job behind it.
#
# Regeneration dispatches get their OWN group, so a routine push cannot cancel
# one. That matters because the commit-back step is gated on !cancelled(), which
# is false once the concurrency manager cancels a run -- an interrupted
# regeneration would therefore discard ~90 minutes of work and 427 baselines
# silently, showing only "cancelled" in the Actions UI. On a push event the
# inputs context is empty, so the suffix evaluates to '' and pushes still
# supersede each other as intended.
concurrency:
  group: js-tests-${{ github.ref }}${{ inputs.update_snapshots && '-regen' || '' }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This job never launches a browser, so skip the ~150MB Chrome download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every test step below runs even if an earlier one failed, so a single
      # failure does not hide the rest. The job still reports red. Gated on the
      # install succeeding, so a broken npm ci does not cascade.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp testSpecs

      # Deliberately NOT `gulp build`. That sequence starts with `clean`, which
      # deletes ['browser', 'inst', 'man', 'R', '.tmp']. `man/CombinedScatter.Rd`
      # is tracked and is only regenerated by `makeDocs`, which shells out to
      # `r --no-save <<< "library(devtools); document()"` -- unavailable here, and
      # its failure is swallowed by an unconditional done(null). So `gulp build`
      # would silently delete a tracked file. These two tasks are the compile
      # check we actually want, and neither cleans.
      - name: Compile widget bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp core compileWidgetEntryPoint

  visual:
    name: Visual regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      # actions: write is needed only to dispatch the follow-up verification
      # run after committing regenerated baselines (see the last step).
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned explicitly so text metrics do not drift with the base image.
      # Label placement is what this widget is for, and the pixel threshold is
      # 0.0001%, so a font change invalidates every baseline.
      # The Chromium libs are for puppeteer 13's bundled build (~Chrome 101),
      # which may hard-link libraries modern Chrome has since dropped. Note
      # libasound2t64, not libasound2 -- Ubuntu 24.04 renamed it, and the old
      # name does not resolve.
      - name: Install fonts and Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core fonts-noto-color-emoji \
            libxss1 libxtst6 libx11-xcb1 libxshmfence1 libgbm1 libasound2t64
          sudo fc-cache -f

      # No puppeteer browser cache. puppeteer 13 downloads into
      # node_modules/puppeteer/.local-chromium/, not ~/.cache/puppeteer (that is
      # the v19+ @puppeteer/browsers location), and `npm ci` wipes node_modules
      # every run anyway -- so a cache there cannot survive. Making it work would
      # mean relocating the download via PUPPETEER_DOWNLOAD_PATH and caching that.
      # Deliberately skipped: it is a pure optimisation, and a misconfigured
      # download path fails the job confusingly. Chromium re-downloads each run.

      - name: Install dependencies
        id: install
        run: npm ci

      # No --env flag: rhtmlBuildUtils constrains --env to ['local', 'travis'],
      # so 'ci' comes from build/config/widget.config.js instead. --branch is
      # likewise omitted, defaulting to master, so every branch compares
      # against master's baselines.
      # TEST_FILTER goes through env: rather than being interpolated into the
      # run script, so the input is not substituted into the shell command here.
      # NB this is mitigation at the YAML layer only -- rhtmlBuildUtils splices
      # the -t value unescaped into a second command string that it runs via
      # shelljs (/bin/sh -c), so a value with shell metacharacters would still
      # be interpreted there. Acceptable: workflow_dispatch already requires
      # write access, and anyone with that could edit this file directly.
      #
      # --acceptNewSnapshots=false is what makes a MISSING baseline fail rather
      # than pass. rhtmlBuildUtils defaults that option to true, which appends
      # --ci=0 to the jest command; jest then computes
      #   updateSnapshot = ci && !updateSnapshot ? 'none' : ... : 'new'
      # (jest-config/build/normalize.js:1171), so 'new' means jest-image-snapshot
      # writes the baseline and the test PASSES. Combined with the commit-back
      # step running only on update_snapshots, that baseline would then be
      # discarded with the runner -- a new snapshot would look green forever and
      # never actually be regression-tested. Omitting --ci=0 lets jest infer
      # ci=true from CI=true (jest-cli defaults ci to is-ci), giving
      # updateSnapshot='none', which fails with "New snapshot was not written".
      # New snapshots and mismatches then behave identically: red, and accepted
      # via an update_snapshots dispatch.
      - name: Visual regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !inputs.update_snapshots }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx gulp testVisual --acceptNewSnapshots=false -t "$TEST_FILTER"
          else
            npx gulp testVisual --acceptNewSnapshots=false
          fi

      # Same no---env and env:-passthrough reasoning as the step above. -u makes
      # jest-image-snapshot write baselines instead of failing on mismatch.
      - name: Regenerate baselines
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.update_snapshots }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx gulp testVisual -u -t "$TEST_FILTER"
          else
            npx gulp testVisual -u
          fi

      - name: Upload snapshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            theSrc/test/snapshots/ci/**/__diff_output__/**
            theSrc/test/snapshots/ci/**/new_snapshots/**
          if-no-files-found: ignore
          retention-days: 14

      # Deliberately runs even if the regeneration step exited non-zero: a
      # partial regeneration is still worth capturing, and the uploaded diffs
      # show what failed. Review the commit before merging.
      # Guarded on ref_type: a dispatch against a tag would push to an existing
      # refs/tags/<name>, which git rejects, failing the job after a full
      # regeneration. Baselines are only ever committed back to a branch.
      - name: Commit regenerated baselines
        id: commit_baselines
        if: ${{ !cancelled() && inputs.update_snapshots && github.ref_type == 'branch' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add theSrc/test/snapshots/ci
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit'
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Regenerate visual regression baselines'
          git push origin "HEAD:$REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The push above does NOT start a run: GitHub suppresses workflow runs for
      # pushes made with the default GITHUB_TOKEN, to prevent recursion. A
      # workflow_dispatch through the API is not suppressed, so dispatch one
      # explicitly -- otherwise the newly committed baselines are never verified
      # and the newest visible run stays the (failing) regeneration one.
      #
      # This terminates rather than looping: the run started here leaves
      # update_snapshots at its default of false, so it only tests. It neither
      # commits nor dispatches anything further.
      #
      # Gated on the commit actually happening, so a no-op regeneration does not
      # burn a run.
      - name: Verify the regenerated baselines
        if: ${{ !cancelled() && steps.commit_baselines.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run js-tests.yaml --ref "$REF_NAME"
