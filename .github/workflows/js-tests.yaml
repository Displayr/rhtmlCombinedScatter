name: JS tests

# The procedure for accepting new visual baselines is documented in README.md,
# under "Updating visual test baselines". The comments below explain why the
# workflow is wired the way it is, not how to use it.

on:
  push:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Run only tests matching this name pattern (jest -t). Leave blank for all.'
        type: string
        default: ''
      update_snapshots:
        description: 'Regenerate visual baselines and upload them as an artifact for you to commit'
        type: boolean
        default: false

# One in-flight run per branch; a new push supersedes the previous run rather
# than stacking another full ~430-snapshot visual job behind it.
#
# Regeneration dispatches get their OWN group, so a routine push cannot cancel
# one. That matters because the baseline upload step is gated on !cancelled(),
# which is false once the concurrency manager cancels a run -- an interrupted
# regeneration would therefore discard the entire regenerated set silently,
# showing only "cancelled" in the Actions UI. On a push event the inputs
# context is empty, so the suffix evaluates to '' and pushes still supersede
# each other as intended.
concurrency:
  group: js-tests-${{ github.ref }}${{ inputs.update_snapshots && '-regen' || '' }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This job never launches a browser, so skip the ~150MB Chrome download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every test step below runs even if an earlier one failed, so a single
      # failure does not hide the rest. The job still reports red. Gated on the
      # install succeeding, so a broken npm ci does not cascade.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx rhtml lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx rhtml testSpecs

      # Still deliberately NOT `rhtml build`. rhtmlBuildUtils 9.0.0 fixed the worst of it -- `clean` no
      # longer deletes the tracked `man/` that only the failure-swallowing `makeDocs` can rebuild -- but
      # `build` also runs `clean` and `makeDocs`, neither of which is a useful compile check here. These
      # two tasks are the check we actually want, and neither cleans.
      - name: Compile widget bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx rhtml core compileWidgetEntryPoint

  visual:
    name: Visual regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Read-only: this job neither pushes nor dispatches. Regenerated baselines
    # are uploaded as an artifact for a human to commit -- see the last step.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The fonts are pinned explicitly so text metrics do not drift with the base image. Label placement
      # is what this widget is for, and the pixel threshold is 0.0001%, so a font change invalidates every
      # baseline. That is also why the runner is a pinned ubuntu-24.04 and not ubuntu-latest.
      #
      # The library list is puppeteer 24's Chrome (~Chrome 14x), not puppeteer 13's 2022 build: the old
      # list carried libxss1/libxtst6/libx11-xcb1/libxshmfence1 for libraries modern Chrome no longer
      # links, and lacked the gtk/nss/cups set it does need. libasound2t64, not libasound2 -- Ubuntu 24.04
      # renamed it and the old name does not resolve.
      - name: Install fonts and Chrome runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core fonts-noto-color-emoji \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libnspr4 libnss3 \
            libpango-1.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2
          sudo fc-cache -f

      # Now cacheable, which it was not before. puppeteer 13 downloaded into
      # node_modules/puppeteer/.local-chromium/, which `npm ci` wipes every run; puppeteer 19+ uses
      # @puppeteer/browsers and ~/.cache/puppeteer, which survives. Keyed on the lockfile because that is
      # what pins the puppeteer version and therefore the Chrome revision.
      - name: Cache the puppeteer browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        id: install
        run: npm ci

      # No --env flag needed: 'ci' comes from build/config/widget.config.js. That started as a workaround
      # -- rhtmlBuildUtils used to constrain --env to ['local', 'travis'] and yargs rejected 'ci' -- and
      # 9.0.0 dropped that whitelist, so it could now be passed here instead. Left in the config because
      # it is genuinely per-repo, and a command line --env still wins for local runs. --branch is likewise
      # omitted, defaulting to master, so every branch compares against master's baselines.
      # TEST_FILTER goes through env: rather than being interpolated into the
      # run script, so the input is not substituted into the shell command here.
      # NB this is mitigation at the YAML layer only -- rhtmlBuildUtils splices
      # the -t value unescaped into a second command string that it runs via
      # shelljs (/bin/sh -c), so a value with shell metacharacters would still
      # be interpreted there. Acceptable: workflow_dispatch already requires
      # write access, and anyone with that could edit this file directly.
      #
      # The explicit --acceptNewSnapshots=false is gone because rhtmlBuildUtils 9.0.0 made false the
      # DEFAULT. It was needed while the default was true, which appended --ci=0 to the jest command; jest
      # then computed updateSnapshot: 'new' (jest-config/build/normalize.js), so jest-image-snapshot wrote
      # the missing baseline and the test PASSED -- and since baselines only leave CI on an explicit
      # regeneration, a new snapshot looked green forever while never being regression-tested. With the
      # default fixed, jest infers ci=true from CI=true and a missing baseline fails with "New snapshot was
      # not written", so new snapshots and mismatches behave identically: red, accepted via a dispatch.
      #
      # 9.0.0 also made a MISMATCHING snapshot fail its own test. It used to be swallowed, so the job only
      # went red via jest's aggregate count while every individual test reported pass.
      - name: Visual regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !inputs.update_snapshots }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx rhtml testVisual -t "$TEST_FILTER"
          else
            npx rhtml testVisual
          fi

      # Same no---env and env:-passthrough reasoning as the step above. -u makes
      # jest-image-snapshot write baselines instead of failing on mismatch.
      - name: Regenerate baselines
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.update_snapshots }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx rhtml testVisual -u -t "$TEST_FILTER"
          else
            npx rhtml testVisual -u
          fi

      - name: Upload snapshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            theSrc/test/snapshots/ci/**/__diff_output__/**
            theSrc/test/snapshots/ci/**/new_snapshots/**
          if-no-files-found: ignore
          retention-days: 14

      # Regenerated baselines are uploaded for a human to commit, NOT committed
      # by CI. Two GitHub behaviours make a bot-authored head commit unusable:
      #
      #   1. A push made with the default GITHUB_TOKEN does not trigger any
      #      workflow (anti-recursion), so build-r-package.yaml -- which triggers
      #      only on push -- never runs on that commit.
      #   2. workflow_dispatch check runs are excluded from a pull request's
      #      status rollup. They exist on the commit and go green, but the PR
      #      reports "no checks reported" and branch protection cannot see them.
      #
      # Net effect of committing from CI was a PR that looked untested. Uploading
      # instead means the human's own push produces the full check set.
      #
      # Runs even if regeneration exited non-zero: a partial regeneration is
      # still worth inspecting alongside the diffs.
      - name: Upload regenerated baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-baselines
          # Exclude the diagnostic directories; they are uploaded separately as
          # snapshot-diffs and are gitignored, so they must not be mistaken for
          # baselines when this artifact is extracted over a working tree.
          path: |
            theSrc/test/snapshots/ci
            !theSrc/test/snapshots/ci/**/__diff_output__
            !theSrc/test/snapshots/ci/**/new_snapshots
          if-no-files-found: error
          retention-days: 14
