name: JS tests

on:
  push:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Run only tests matching this name pattern (jest -t). Leave blank for all.'
        type: string
        default: ''

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    env:
      # This job never launches a browser, so skip the ~150MB Chrome download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every test step below runs even if an earlier one failed, so a single
      # failure does not hide the rest. The job still reports red. Gated on the
      # install succeeding, so a broken npm ci does not cascade.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp testSpecs

      # Deliberately NOT `gulp build`. That sequence starts with `clean`, which
      # deletes ['browser', 'inst', 'man', 'R', '.tmp']. `man/CombinedScatter.Rd`
      # is tracked and is only regenerated by `makeDocs`, which shells out to
      # `r --no-save <<< "library(devtools); document()"` -- unavailable here, and
      # its failure is swallowed by an unconditional done(null). So `gulp build`
      # would silently delete a tracked file. These two tasks are the compile
      # check we actually want, and neither cleans.
      - name: Compile widget bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx gulp core compileWidgetEntryPoint

  visual:
    name: Visual regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned explicitly so text metrics do not drift with the base image.
      # Label placement is what this widget is for, and the pixel threshold is
      # 0.0001%, so a font change invalidates every baseline.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
          sudo fc-cache -f

      # No puppeteer browser cache. puppeteer 13 downloads into
      # node_modules/puppeteer/.local-chromium/, not ~/.cache/puppeteer (that is
      # the v19+ @puppeteer/browsers location), and `npm ci` wipes node_modules
      # every run anyway -- so a cache there cannot survive. Making it work would
      # mean relocating the download via PUPPETEER_DOWNLOAD_PATH and caching that.
      # Deliberately skipped: it is a pure optimisation, and a misconfigured
      # download path fails the job confusingly. Chromium re-downloads each run.

      - name: Install dependencies
        id: install
        run: npm ci

      # No --env flag: rhtmlBuildUtils constrains --env to ['local', 'travis'],
      # so 'ci' comes from build/config/widget.config.js instead. --branch is
      # likewise omitted, defaulting to master, so every branch compares
      # against master's baselines.
      # TEST_FILTER goes through env: rather than being interpolated into the
      # run script, so the input is not substituted into the shell command here.
      # NB this is mitigation at the YAML layer only -- rhtmlBuildUtils splices
      # the -t value unescaped into a second command string that it runs via
      # shelljs (/bin/sh -c), so a value with shell metacharacters would still
      # be interpreted there. Acceptable: workflow_dispatch already requires
      # write access, and anyone with that could edit this file directly.
      - name: Visual regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx gulp testVisual -t "$TEST_FILTER"
          else
            npx gulp testVisual
          fi

      - name: Upload snapshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: theSrc/test/snapshots/ci/**/__diff_output__/**
          if-no-files-found: ignore
          retention-days: 14
